<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DLG 2026">
<title>DLG 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#080810;--s1:#0f0f1a;--s2:#14141f;--s3:#1a1a28;--s4:#20202e;
  --border:#252535;--border2:#2e2e42;
  --text:#eeeef5;--muted:#7777a0;--muted2:#44445a;
  --accent:#e8ff47;--a2:#47b8ff;--a3:#ff6b47;--green:#47ffb8;--purple:#b847ff;
  --red:#ff4757;--orange:#ffb347;
  --r:10px;--r2:14px;
}
.light{
  --bg:#f2f2fa;--s1:#ffffff;--s2:#f7f7fe;--s3:#efeffa;--s4:#e8e8f5;
  --border:#ddddf0;--border2:#ccccE8;
  --text:#15152a;--muted:#6666a0;--muted2:#aaaacc;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;overflow:hidden;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;}
input{font-family:inherit;outline:none;}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh;}
#header{flex-shrink:0;background:var(--s1);border-bottom:1px solid var(--border);padding:10px 14px 0;}
#pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
#nav{flex-shrink:0;display:flex;background:var(--s1);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.08em;transition:color .15s;-webkit-tap-highlight-color:transparent;}
.nav-btn.active{color:var(--accent);}
.nav-icon{font-size:17px;line-height:1.2;}
.page{display:none;padding:12px 12px 32px;}
.page.active{display:block;}

/* ── HEADER ── */
.hdr-row1{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;}
.hdr-brand{display:flex;flex-direction:column;}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.06em;color:var(--accent);line-height:1;}
.hdr-sub{font-size:9px;letter-spacing:.15em;color:var(--muted);margin-top:1px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.days-wrap{text-align:right;}
.days-num{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);line-height:1;}
.days-lbl{font-size:8px;letter-spacing:.12em;color:var(--muted);}
.icon-btn{width:30px;height:30px;border-radius:50%;background:var(--s3);color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}

/* header stats bar */
.hdr-stats{display:flex;gap:0;margin:0 -14px;padding:6px 14px;border-top:1px solid var(--border);}
.hstat{flex:1;text-align:center;padding:4px 0;}
.hstat+.hstat{border-left:1px solid var(--border);}
.hstat-val{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;}
.hstat-lbl{font-size:8px;letter-spacing:.1em;color:var(--muted);margin-top:1px;}

/* XP bar */
.xp-row{display:flex;align-items:center;gap:8px;padding:6px 0 8px;}
.xp-level{font-size:10px;font-weight:700;color:var(--accent);white-space:nowrap;}
.xp-bar-track{flex:1;height:3px;background:var(--s3);border-radius:2px;overflow:hidden;}
.xp-bar-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .6s ease;}
.xp-to-next{font-size:9px;color:var(--muted);white-space:nowrap;}

/* ── SHARED COMPONENTS ── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px;}
.card-title{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:10px;}
.sec-header{margin-bottom:8px;}
.sec-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.05em;}
.sec-meta{font-size:10px;color:var(--muted);margin-top:1px;}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;letter-spacing:.06em;}
.tag.deload{background:rgba(71,255,184,.1);color:var(--green);border:1px solid rgba(71,255,184,.2);}
.tag.test{background:rgba(71,184,255,.1);color:var(--a2);border:1px solid rgba(71,184,255,.2);}
.tag.peak{background:rgba(255,107,71,.1);color:var(--a3);border:1px solid rgba(255,107,71,.2);}
.tag.race{background:rgba(232,255,71,.12);color:var(--accent);border:1px solid rgba(232,255,71,.25);}
.tag.now{background:rgba(232,255,71,.15);color:var(--accent);border:1px solid rgba(232,255,71,.3);}
.tag.adapted{background:rgba(184,71,255,.1);color:var(--purple);border:1px solid rgba(184,71,255,.2);}

/* ── PHASE BANNER ── */
.phase-banner{border-radius:var(--r);padding:8px 12px;margin-bottom:8px;border-left:3px solid;}
.phase-banner.p1{background:rgba(71,184,255,.05);border-color:rgba(71,184,255,.5);}
.phase-banner.p2{background:rgba(184,71,255,.05);border-color:rgba(184,71,255,.5);}
.phase-banner.p3{background:rgba(255,107,71,.05);border-color:rgba(255,107,71,.5);}
.phase-banner.p4{background:rgba(232,255,71,.05);border-color:rgba(232,255,71,.5);}

/* ── WEEK CARD ── */
.wcard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:8px;overflow:hidden;}
.wcard.adapted-week{border-color:rgba(184,71,255,.35);}
.whead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;gap:8px;}
.whead-l{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.wnum{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--muted2);line-height:1;flex-shrink:0;width:26px;}
.wnum.cur{color:var(--accent);}
.winfo{flex:1;min-width:0;}
.wtitle{font-size:12px;font-weight:700;line-height:1.3;}
.wsub{font-size:9px;color:var(--muted);margin-top:2px;}
.whead-r{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
circle.ring-bg{fill:none;stroke:var(--border2);stroke-width:2.5;}
circle.ring-fg{fill:none;stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset .5s,stroke .3s;}
.wtoggle{font-size:10px;color:var(--muted);width:14px;text-align:center;}

/* ── SESSION ROW ── */
.wbody{border-top:1px solid var(--border);}
.srow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);border-left:3px solid transparent;transition:background .15s;}
.srow:last-of-type{border-bottom:none;}
.srow.d-mi{border-left-color:rgba(232,255,71,.5);}
.srow.d-sa{border-left-color:rgba(255,107,71,.5);}
.srow.d-do{border-left-color:rgba(71,255,184,.4);}
.srow.d-mo{border-left-color:rgba(71,184,255,.4);}
.srow.d-fr{border-left-color:rgba(150,150,190,.2);}
.srow.d-di,.srow.d-so{border-left-color:rgba(150,150,190,.08);}
.srow.adapted-sess{background:rgba(184,71,255,.04);}
.day-pill{width:28px;height:16px;border-radius:4px;font-size:8px;font-family:'DM Mono',monospace;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.d-mi .day-pill{background:rgba(232,255,71,.1);color:var(--accent);border:1px solid rgba(232,255,71,.2);}
.d-sa .day-pill{background:rgba(255,107,71,.1);color:var(--a3);border:1px solid rgba(255,107,71,.2);}
.d-do .day-pill{background:rgba(71,255,184,.08);color:var(--green);border:1px solid rgba(71,255,184,.15);}
.d-mo .day-pill{background:rgba(71,184,255,.08);color:var(--a2);border:1px solid rgba(71,184,255,.15);}
.d-fr .day-pill,.d-di .day-pill,.d-so .day-pill{background:var(--s3);color:var(--muted);border:1px solid var(--border);}
.scontent{flex:1;min-width:0;}
.sname{font-size:11px;font-weight:600;line-height:1.3;}
.sname.done-s{text-decoration:line-through;color:var(--muted);}
.sdesc{font-size:10px;color:var(--muted);margin-top:1px;line-height:1.4;}
.sadapted{font-size:9px;color:var(--purple);margin-top:2px;font-style:italic;}
.sact{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.zwo-btn{padding:2px 7px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.04em;background:rgba(71,184,255,.1);color:var(--a2);border:1px solid rgba(71,184,255,.2);-webkit-tap-highlight-color:transparent;}

/* focus + checks */
.wfocus{padding:8px 12px;border-top:1px solid var(--border);background:var(--s2);}
.focus-lbl{font-size:8px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:3px;}
.focus-txt{font-size:10px;color:var(--muted);line-height:1.5;}
.wchecks{padding:8px 12px;border-top:1px solid var(--border);}
.checks-lbl{font-size:8px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;}
.ci-txt{font-size:11px;color:var(--text);line-height:1.4;pointer-events:none;}

/* ── COACH TAB ── */
.coach-hero{background:linear-gradient(135deg,rgba(232,255,71,.06) 0%,rgba(71,184,255,.06) 100%);border:1px solid var(--border2);border-radius:var(--r2);padding:16px;margin-bottom:10px;}
.coach-status{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.status-dot.green{background:var(--green);box-shadow:0 0 8px rgba(71,255,184,.5);}
.status-dot.yellow{background:var(--orange);box-shadow:0 0 8px rgba(255,179,71,.5);}
.status-dot.red{background:var(--red);box-shadow:0 0 8px rgba(255,71,87,.5);}
.status-label{font-size:11px;font-weight:700;letter-spacing:.06em;}
.coach-msg{font-size:12px;color:var(--muted);line-height:1.6;}
.coach-msg strong{color:var(--text);}

.section-title{font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;margin-top:4px;}

/* FTP test input card */
.test-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:14px;margin-bottom:10px;}
.test-title{font-size:12px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.test-badge{padding:2px 8px;border-radius:6px;font-size:9px;font-weight:700;}
.test-badge.w6{background:rgba(71,184,255,.12);color:var(--a2);}
.test-badge.w12{background:rgba(184,71,255,.12);color:var(--purple);}

/* result cards */
.decision-card{border-radius:var(--r);padding:12px;margin-top:10px;border:1px solid;}
.decision-card.green{background:rgba(71,255,184,.06);border-color:rgba(71,255,184,.25);}
.decision-card.yellow{background:rgba(255,179,71,.06);border-color:rgba(255,179,71,.25);}
.decision-card.red{background:rgba(255,71,87,.06);border-color:rgba(255,71,87,.25);}
.dec-icon{font-size:20px;margin-bottom:6px;}
.dec-title{font-size:12px;font-weight:700;margin-bottom:4px;}
.dec-msg{font-size:11px;color:var(--muted);line-height:1.5;}
.dec-actions{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.dec-action{font-size:10px;color:var(--text);padding:4px 0;border-top:1px solid var(--border);padding-top:6px;}
.dec-action:first-child{border-top:none;padding-top:0;}

/* Daily check */
.daily-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.daily-item{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:10px;}
.daily-item-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;}
.slider-wrap{display:flex;align-items:center;gap:6px;}
.daily-slider{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--border2);outline:none;}
.daily-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
.slider-val{font-family:'DM Mono',monospace;font-size:11px;color:var(--text);min-width:14px;text-align:right;}
.rec-card{background:var(--s2);border-radius:var(--r);padding:10px;margin-top:8px;border-left:3px solid;}
.rec-card.go{border-color:var(--green);}
.rec-card.mod{border-color:var(--orange);}
.rec-card.stop{border-color:var(--red);}
.rec-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;margin-bottom:3px;}
.rec-txt{font-size:11px;color:var(--muted);line-height:1.5;}

/* prognosis */
.prog-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.prog-box{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center;}
.prog-val{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.04em;line-height:1;}
.prog-lbl{font-size:8px;letter-spacing:.1em;color:var(--muted);margin-top:3px;}

/* ── FTP TAB ── */
.ftp-hero-wrap{text-align:center;padding:16px 0 8px;}
.ftp-hero{font-family:'Bebas Neue',sans-serif;font-size:64px;letter-spacing:.02em;color:var(--accent);line-height:1;}
.ftp-wkg{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);margin-top:4px;}
.zones-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.zone-box{border-radius:8px;padding:9px;text-align:center;border:1px solid;}
.zone-name{font-size:8px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:3px;}
.zone-val{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;margin-bottom:1px;}
.zone-sub{font-size:8px;color:var(--muted2);}
.input-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;margin-top:10px;}
.input-lbl:first-of-type{margin-top:0;}
.input-row{display:flex;gap:6px;align-items:stretch;}
.inp{flex:1;background:var(--s2);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;}
.inp:focus{border-color:rgba(232,255,71,.4);}
.btn-accent{padding:9px 14px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.05em;background:var(--accent);color:#080810;-webkit-tap-highlight-color:transparent;white-space:nowrap;flex-shrink:0;}
.btn-a2{background:var(--a2);color:#080810;}
.btn-a3{background:var(--a3);color:#080810;}
.btn-full{width:100%;margin-top:8px;padding:11px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.05em;background:var(--accent);color:#080810;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);}
.hist-row:last-child{border-bottom:none;}
.hist-date{font-size:10px;color:var(--muted);}
.hist-right{display:flex;align-items:baseline;gap:4px;}
.hist-ftp{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);}
.hist-wkg{font-size:9px;color:var(--muted);}
.hist-delta{font-size:10px;padding:1px 6px;border-radius:6px;}
.hist-delta.pos{background:rgba(71,255,184,.1);color:var(--green);}
.hist-delta.neg{background:rgba(255,71,87,.1);color:var(--red);}

/* ── TOAST ── */
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--s3);border:1px solid var(--border2);border-radius:20px;padding:7px 16px;font-size:11px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;z-index:999;max-width:calc(100vw - 32px);text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="hdr-row1">
      <div class="hdr-brand">
        <div class="hdr-title">DLG 2026</div>
        <div class="hdr-sub">DREILÄNDERGIRO · 28. JUNI</div>
      </div>
      <div class="hdr-right">
        <div class="days-wrap">
          <div class="days-num" id="daysNum">-</div>
          <div class="days-lbl">TAGE</div>
        </div>
        <button class="icon-btn" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
    <div class="hdr-stats">
      <div class="hstat"><div class="hstat-val" id="hFTP" style="color:#e8ff47">272W</div><div class="hstat-lbl">FTP</div></div>
      <div class="hstat"><div class="hstat-val" id="hSess">0</div><div class="hstat-lbl">SESSIONS</div></div>
      <div class="hstat"><div class="hstat-val" id="hPct" style="color:#ff6b47">0%</div><div class="hstat-lbl">PLAN</div></div>
      <div class="hstat"><div class="hstat-val" id="hXP">0</div><div class="hstat-lbl">XP</div></div>
    </div>
    <div class="xp-row">
      <div class="xp-level" id="xpLevel">L1 · ANFÄNGER</div>
      <div class="xp-bar-track"><div class="xp-bar-fill" id="xpFill" style="width:0%"></div></div>
      <div class="xp-to-next" id="xpNext">200 XP</div>
    </div>
  </div>

  <div id="pages">
    <div class="page active" id="page-plan"></div>
    <div class="page" id="page-coach"></div>
    <div class="page" id="page-ftp"></div>
  </div>

  <nav id="nav">
    <button class="nav-btn active" id="nb-plan" onclick="showPage('plan')">
      <span class="nav-icon">📋</span>PLAN
    </button>
    <button class="nav-btn" id="nb-coach" onclick="showPage('coach')">
      <span class="nav-icon">🧠</span>COACH
    </button>
    <button class="nav-btn" id="nb-ftp" onclick="showPage('ftp')">
      <span class="nav-icon">⚡</span>FTP & HR
    </button>
  </nav>
</div>
<div id="toast"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
const SK = 'dlg2026_v7';
function load(){ try{ return JSON.parse(localStorage.getItem(SK)||'{}'); }catch(e){ return {}; } }
function save(){ localStorage.setItem(SK, JSON.stringify(S)); }
let S = load();

// Defaults
if(!S.ftp)        S.ftp = 272;
if(!S.weight)     S.weight = 84.5;
if(!S.hrMax)      S.hrMax = 184;
if(!S.hrRest)     S.hrRest = 52;
if(!S.theme)      S.theme = 'dark';
if(!S.ftpHistory) S.ftpHistory = [{date:'20.02.2026', ftp:272, wkg:'3.22', label:'Baseline'}];
// Adaptive: ftpW6, ftpW12, daily checks
// S.ftpW6 = {peak, ftp, date}
// S.ftpW12 = {peak, ftp, date}
// S.daily = {date: {sleep, fatigue, motivation, hrRest}}

// ═══════════════════════════════════════════════
// PLAN DATA
// ═══════════════════════════════════════════════
// ftpRef: which FTP to use for ZWO generation
// 'base'=272, 'w6'=S.ftpW6||285, 'w12'=S.ftpW12||295, 'taper'=300
function getFTP(ref){
  if(ref==='w6')    return (S.ftpW6  && S.ftpW6.ftp)  || 285;
  if(ref==='w12')   return (S.ftpW12 && S.ftpW12.ftp) || 295;
  if(ref==='taper') return S.ftp || 300;
  return S.ftp || 272;
}

const PHASES = [
  {cls:'p1', name:'PHASE 1 — BASISAUFBAU',   meta:'W1–6 · 02.03–12.04 · FTP 272→285W · SST 5\'→20\'', weeks:[0,1,2,3,4,5]},
  {cls:'p2', name:'PHASE 2 — INTENSIVIERUNG', meta:'W7–12 · 13.04–24.05 · FTP 285→295W · VO2max + SST', weeks:[6,7,8,9,10,11]},
  {cls:'p3', name:'PHASE 3 — PEAK',           meta:'W13–16 · 25.05–21.06 · SST bis 50min · Long Rides bis 6h', weeks:[12,13,14,15]},
  {cls:'p4', name:'PHASE 4 — TAPER + RACE',   meta:'W17 · 22.–28.06 · Frische → RENNEN', weeks:[16]},
];

// Helper to build ZWO descriptor
function z2(ftpRef, wuS, durS, pwr, cad, nm){ return {type:'z2',ftpRef,wu:wuS,main:{dur:durS,pwr,cad},cd:600,name:nm}; }
function sst(ftpRef, wu, ivs, nm){ return {type:'sst',ftpRef,wu,intervals:ivs,cd:600,name:nm}; }
function vo2(ftpRef, wu, ivs, nm){ return {type:'vo2',ftpRef,wu,intervals:ivs,cd:600,name:nm}; }
function ramp(ftpRef, nm){ return {type:'ramp',ftpRef,name:nm}; }
function opener(ftpRef, ivs, nm){ return {type:'opener',ftpRef,wu:900,intervals:ivs,cd:600,name:nm}; }
// interval shorthand: [dur, pwr, cad?]
function iv(dur,pwr,cad){ return {dur,pwr,cad}; }

const LEVELS=[
  {min:0,    name:'ANFÄNGER', icon:'🚲'},
  {min:200,  name:'FAHRER',   icon:'🚴'},
  {min:500,  name:'SPORTLER', icon:'⭐'},
  {min:1000, name:'ATHLET',   icon:'🔥'},
  {min:2000, name:'PROFI',    icon:'💪'},
  {min:3000, name:'CHAMPION', icon:'🏆'},
  {min:4500, name:'DLG-BEREIT',icon:'🚀'},
];
function getXP(){ let e=0; WEEKS.forEach((w,wi)=>{ w.sessions.forEach((s,si)=>{ if(s.xp>0&&S[`s_${wi}_${si}`]) e+=s.xp; }); w.checks.forEach((_,ci)=>{ if(S[`c_${wi}_${ci}`]) e+=10; }); }); return e; }
function getLvl(xp){ let l=LEVELS[0],i=0; for(let j=LEVELS.length-1;j>=0;j--){ if(xp>=LEVELS[j].min){l=LEVELS[j];i=j;break;} } const nx=LEVELS[i+1]||null; return {l,nx,i,pct:nx?Math.round((xp-l.min)/(nx.min-l.min)*100):100}; }
function getWkProg(wi){ const w=WEEKS[wi]; let d=0,t=0; w.sessions.forEach((s,si)=>{ if(s.xp>0){t++;if(S[`s_${wi}_${si}`])d++;} }); return {d,t,pct:t?Math.round(d/t*100):0}; }
function getCurWeek(){ const now=new Date(), s=new Date('2026-03-02'); return Math.max(0,Math.min(16,Math.floor((now-s)/(7*24*3600*1000)))); }
function daysLeft(){ return Math.max(0,Math.ceil((new Date('2026-06-28')-new Date())/(24*3600*1000))); }

function getDecision(testNum, ftp){
  if(testNum===1){
    if(ftp>=285) return {color:'green', icon:'✅', title:'GRÜN — Auf Kurs!', msg:'FTP ≥285W erreicht. Phase 2 wie geplant.', actions:['VO2max-Watt: '+Math.round(ftp*1.12)+'W (112%)','Z2: '+Math.round(ftp*.65)+'W | SST: '+Math.round(ftp*.91)+'W','Alle ZWOs in W7–12 mit '+ftp+'W neu generieren']};
    if(ftp>=278) return {color:'yellow', icon:'⚠️', title:'GELB — Fast!', msg:'FTP 278–284W. Phase 2 starten, VO2max-Einstieg konservativer.', actions:['VO2max-Watt: '+Math.round(ftp*1.12)+'W (statt '+Math.round(285*1.12)+'W)','Erste VO2-Session: 4×3\' statt 5×3\'','Rest W7–12 planmäßig']};
    return {color:'red', icon:'🔴', title:'ROT — Mehr Zeit', msg:'FTP <278W. W5–6 Struktur in W7–8 wiederholen, dann weiter.', actions:['W7: SST 2×20\' statt VO2max','W8: FTP erneut testen','Phase 2 um 2 Wochen verschoben — kein Drama']};
  } else {
    if(ftp>=295) return {color:'green', icon:'✅', title:'GRÜN — Auf Kurs!', msg:'FTP ≥295W. Phase 3 wie geplant.', actions:['SST-Watt Phase 3: '+Math.round(ftp*.9)+'W','Renntag-Prognose: 6:15–6:45h realistisch','Alle ZWOs W13–16 mit '+ftp+'W generieren']};
    if(ftp>=288) return {color:'yellow', icon:'⚠️', title:'GELB — Gut genug!', msg:'FTP 288–294W. Phase 3 starten, Zielzeit anpassen.', actions:['Zielzeit Anpassung: <6:45h','SST Phase 3: '+Math.round(ftp*.9)+'W','Long Rides wie geplant']};
    return {color:'red', icon:'🔴', title:'ROT — Plan anpassen', msg:'FTP <288W. W9–10 Struktur in W13–14 wiederholen.', actions:['W13–14: VO2max-Block statt Peak','W15–16: wie geplant','Taper NICHT kürzen']};
  }
}

function getRacePrognosis(){
  const ftp = S.ftp || 272;
  const wkg = ftp / (S.weight || 84.5);
  // Rough model: base 8h for 272W, -6min per W above 272, bonus for wkg
  const baseMin = 480;
  const delta = (ftp - 272) * -0.35;
  const mins = Math.round(baseMin + delta);
  const h = Math.floor(mins/60), m = mins%60;
  const timeStr = h+'h '+String(m).padStart(2,'0')+'min';
  let conf = ftp>=295?'Hoch':ftp>=285?'Mittel':'Aufbauend';
  return {time:timeStr, ftp, wkg:wkg.toFixed(2), conf};
}

function getDailyRec(sleep, fatigue, motivation){
  const score = (sleep/10)*40 + ((10-fatigue)/10)*30 + (motivation/10)*30;
  if(score >= 70) return {cls:'go',   lbl:'GO — VOLLES PROGRAMM', msg:'Körper ist bereit. Alle Sessions wie geplant durchführen.'};
  if(score >= 45) return {cls:'mod',  lbl:'MODERAT — ANGEPASST',  msg:'Intensität -10%, Volumen wie geplant. Bei MI-Intervallen: Watt halten, Anzahl ggf. -1.'};
  return            {cls:'stop', lbl:'STOP — DELOAD TAG',    msg:'Ruhetag oder nur lockere Z1-Fahrt 30min. Schlaf und Ernährung priorisieren.'};
}

// ZWO GENERATION
// ═══════════════════════════════════════════════
function makeZWO(z){
  const ftp = getFTP(z.ftpRef);
  const cTag = c => c ? ` Cadence="${c}"` : '';
  let xml = `<?xml version="1.0" encoding="UTF-8"?>\n<workout_file>\n  <author>DLG 2026 Coach</author>\n  <n>${z.name}</n>\n  <description>FTP ${ftp}W | Kadenz ≥88 rpm | DLG 2026 Adaptive</description>\n  <sportType>bike</sportType>\n  <tags/>\n  <workout>\n`;

  if(z.type==='ramp'){
    xml += `    <Warmup Duration="600" PowerLow="0.400" PowerHigh="0.700"${cTag(85)}/>\n`;
    for(let i=0;i<20;i++){
      const p=(0.550+i*0.0375).toFixed(3);
      xml += `    <SteadyState Duration="60" Power="${p}"${cTag(88)}/>\n`;
    }
    xml += `    <Cooldown Duration="600" PowerLow="0.500" PowerHigh="0.300"${cTag(85)}/>\n`;
  } else {
    xml += `    <Warmup Duration="${z.wu}" PowerLow="0.450" PowerHigh="0.700"${cTag(85)}/>\n`;
    if(z.type==='z2'){
      xml += `    <SteadyState Duration="${z.main.dur}" Power="${z.main.pwr.toFixed(3)}"${cTag(z.main.cad)}/>\n`;
    } else {
      z.intervals.forEach(i=>{ xml += `    <SteadyState Duration="${i.dur}" Power="${i.pwr.toFixed(3)}"${cTag(i.cad)}/>\n`; });
    }
    xml += `    <Cooldown Duration="${z.cd}" PowerLow="0.600" PowerHigh="0.350"${cTag(85)}/>\n`;
  }
  xml += `  </workout>\n</workout_file>`;
  return xml;
}

function dlZWO(wi,si){
  const s=WEEKS[wi].sessions[si];
  if(!s.zwo) return;
  const xml=makeZWO(s.zwo);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([xml],{type:'application/xml'}));
  a.download=s.zwo.name+'.zwo';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  showToast('ZWO gespeichert ('+getFTP(s.zwo.ftpRef)+'W)');
}

function renderCoach(){
  const con=document.getElementById('page-coach');
  con.innerHTML='';

  // ── STATUS HERO ──
  const prog=getRacePrognosis();
  const hasW6=!!S.ftpW6, hasW12=!!S.ftpW12;
  const statusColor = hasW12?'green':hasW6?'yellow':'red';
  const statusMsg = hasW12
    ? '<strong>Test #2 eingetragen.</strong> Plan vollständig adaptiert auf '+prog.ftp+'W. Renntag-Prognose: '+prog.time+'.'
    : hasW6
    ? '<strong>Test #1 eingetragen.</strong> Phase 2 adaptiert. Test #2 nach W12 eintragen.'
    : 'Noch keine FTP-Tests eingetragen. <strong>Baseline: 272W.</strong> Nach W6-Test hier eintragen.';

  const hero=document.createElement('div');
  hero.className='coach-hero';
  hero.innerHTML='<div class="coach-status"><div class="status-dot '+statusColor+'"></div><div class="status-label" style="color:var(--'+(statusColor==='green'?'green':statusColor==='yellow'?'orange':'red')+')">PLAN-STATUS</div></div><div class="coach-msg">'+statusMsg+'</div>';
  con.appendChild(hero);

  // ── PROGNOSIS ──
  const pTitle=document.createElement('div'); pTitle.className='section-title'; pTitle.textContent='RENNTAG-PROGNOSE'; con.appendChild(pTitle);
  const pg=document.createElement('div'); pg.className='card';
  pg.innerHTML='<div class="card-title">BASIEREND AUF FTP '+prog.ftp+'W · '+prog.wkg+' W/KG</div><div class="prog-grid"><div class="prog-box"><div class="prog-val" style="color:#e8ff47">'+prog.time+'</div><div class="prog-lbl">ZIELZEIT</div></div><div class="prog-box"><div class="prog-val" style="color:#47b8ff">'+prog.ftp+'W</div><div class="prog-lbl">FTP</div></div><div class="prog-box"><div class="prog-val" style="color:#47ffb8">'+prog.conf+'</div><div class="prog-lbl">KONFIDENZ</div></div></div>';
  con.appendChild(pg);

  // ── DAILY CHECK ──
  const dcTitle=document.createElement('div'); dcTitle.className='section-title'; dcTitle.textContent='TAGES-CHECK'; con.appendChild(dcTitle);
  const dcCard=document.createElement('div'); dcCard.className='card';
  const today=new Date().toLocaleDateString('de-DE');
  const saved=S.daily&&S.daily[today]||{sleep:7,fatigue:3,motivation:7};

  dcCard.innerHTML='<div class="card-title">HEUTE · '+today+'</div><div class="daily-grid"><div class="daily-item"><div class="daily-item-lbl">SCHLAF (H)</div><div class="slider-wrap"><input type="range" class="daily-slider" id="slSleep" min="4" max="10" step="0.5" value="'+saved.sleep+'"><span class="slider-val" id="vSleep">'+saved.sleep+'</span></div></div><div class="daily-item"><div class="daily-item-lbl">MÜDIGKEIT (1-10)</div><div class="slider-wrap"><input type="range" class="daily-slider" id="slFat" min="1" max="10" step="1" value="'+saved.fatigue+'"><span class="slider-val" id="vFat">'+saved.fatigue+'</span></div></div><div class="daily-item"><div class="daily-item-lbl">MOTIVATION (1-10)</div><div class="slider-wrap"><input type="range" class="daily-slider" id="slMot" min="1" max="10" step="1" value="'+saved.motivation+'"><span class="slider-val" id="vMot">'+saved.motivation+'</span></div></div><div class="daily-item"><div class="daily-item-lbl">RUHE-HF (BPM)</div><div class="slider-wrap"><input type="range" class="daily-slider" id="slHr" min="35" max="80" step="1" value="'+(saved.hrRest||S.hrRest||52)+'"><span class="slider-val" id="vHr">'+(saved.hrRest||S.hrRest||52)+'</span></div></div></div><div id="recBox"></div>';
  con.appendChild(dcCard);

  function updateRec(){
    const sl=parseFloat(document.getElementById('slSleep').value);
    const fa=parseInt(document.getElementById('slFat').value);
    const mo=parseInt(document.getElementById('slMot').value);
    const hr=parseInt(document.getElementById('slHr').value);
    document.getElementById('vSleep').textContent=sl;
    document.getElementById('vFat').textContent=fa;
    document.getElementById('vMot').textContent=mo;
    document.getElementById('vHr').textContent=hr;
    const rec=getDailyRec(sl,fa,mo);
    // HF warning
    const baseHr=S.hrRest||52;
    const hrWarn=hr>baseHr+5?' ⚠️ +'+Math.round(hr-baseHr)+'bpm über Basis → Overtraining-Signal!':'';
    document.getElementById('recBox').innerHTML='<div class="rec-card '+rec.cls+'"><div class="rec-lbl" style="color:var(--'+(rec.cls==='go'?'green':rec.cls==='mod'?'orange':'red')+')">'+rec.lbl+'</div><div class="rec-txt">'+rec.msg+hrWarn+'</div></div>';
    if(!S.daily) S.daily={};
    S.daily[today]={sleep:sl,fatigue:fa,motivation:mo,hrRest:hr};
    save();
  }
  ['slSleep','slFat','slMot','slHr'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input',updateRec); });
  updateRec();

  // ── FTP TESTS ──
  const ftpTitle=document.createElement('div'); ftpTitle.className='section-title'; ftpTitle.textContent='FTP-TESTS EINTRAGEN'; con.appendChild(ftpTitle);

  // Test 1
  const t1=document.createElement('div'); t1.className='test-card';
  const t1done=S.ftpW6;
  t1.innerHTML='<div class="test-title"><span class="test-badge w6">WOCHE 6</span> FTP RAMP TEST #1 · 08.04.2026</div>'+
    (t1done?'<div style="background:rgba(71,255,184,.06);border:1px solid rgba(71,255,184,.2);border-radius:8px;padding:10px;margin-bottom:10px"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">EINGETRAGEN</div><div style="font-family:DM Mono,monospace;font-size:18px;color:#47ffb8">'+t1done.ftp+'W</div><div style="font-size:10px;color:var(--muted)">'+t1done.wkg+' W/kg · '+t1done.date+'</div></div>':'')+
    '<div class="input-lbl">PEAK POWER (W)</div><div class="input-row"><input class="inp" id="pkW6" type="number" inputmode="numeric" placeholder="z.B. 380" value="'+(t1done?Math.round(t1done.ftp/0.75):'')+'"><button class="btn-accent btn-a2" onclick="saveTest(1)">SPEICHERN</button></div>';
  con.appendChild(t1);

  // Decision W6
  if(t1done){
    const d=getDecision(1,t1done.ftp);
    const dc=document.createElement('div');
    dc.className='decision-card '+d.color;
    dc.innerHTML='<div class="dec-icon">'+d.icon+'</div><div class="dec-title">'+d.title+'</div><div class="dec-msg">'+d.msg+'</div><div class="dec-actions">'+d.actions.map(a=>'<div class="dec-action">→ '+a+'</div>').join('')+'</div>';
    con.appendChild(dc);
  }

  // Test 2
  const t2=document.createElement('div'); t2.className='test-card';
  const t2done=S.ftpW12;
  t2.innerHTML='<div class="test-title"><span class="test-badge w12">WOCHE 12</span> FTP RAMP TEST #2 · 20.05.2026</div>'+
    (t2done?'<div style="background:rgba(184,71,255,.06);border:1px solid rgba(184,71,255,.2);border-radius:8px;padding:10px;margin-bottom:10px"><div style="font-size:11px;color:var(--muted);margin-bottom:4px">EINGETRAGEN</div><div style="font-family:DM Mono,monospace;font-size:18px;color:#b847ff">'+t2done.ftp+'W</div><div style="font-size:10px;color:var(--muted)">'+t2done.wkg+' W/kg · Δ +'+(t2done.ftp-272)+'W seit Baseline</div></div>':'')+
    '<div class="input-lbl">PEAK POWER (W)</div><div class="input-row"><input class="inp" id="pkW12" type="number" inputmode="numeric" placeholder="z.B. 393" value="'+(t2done?Math.round(t2done.ftp/0.75):'')+'"><button class="btn-accent btn-a3" onclick="saveTest(2)">SPEICHERN</button></div>';
  con.appendChild(t2);

  if(t2done){
    const d=getDecision(2,t2done.ftp);
    const dc=document.createElement('div');
    dc.className='decision-card '+d.color;
    dc.innerHTML='<div class="dec-icon">'+d.icon+'</div><div class="dec-title">'+d.title+'</div><div class="dec-msg">'+d.msg+'</div><div class="dec-actions">'+d.actions.map(a=>'<div class="dec-action">→ '+a+'</div>').join('')+'</div>';
    con.appendChild(dc);
  }
}

function saveTest(n){
  const id=n===1?'pkW6':'pkW12';
  const peak=parseFloat(document.getElementById(id).value);
  if(!peak||peak<150){ showToast('Gueltige Peak Power eingeben'); return; }
  const ftp=Math.round(peak*0.75);
  const wt=S.weight||84.5;
  const wkg=(ftp/wt).toFixed(2);
  const today=new Date().toLocaleDateString('de-DE');
  const label='Test #'+n;
  if(n===1){ S.ftpW6={ftp,wkg,date:today,peak}; }
  else      { S.ftpW12={ftp,wkg,date:today,peak}; S.ftp=ftp; }
  if(!S.ftpHistory) S.ftpHistory=[];
  S.ftpHistory.push({date:today,ftp,wkg,label});
  save();
  showToast('Test #'+n+': '+ftp+'W gespeichert! ZWOs aktualisiert.');
  renderCoach();
  updateHdr();
}

// ═══════════════════════════════════════════════
// RENDER FTP
// ═══════════════════════════════════════════════
function renderFTP(){
  const c=document.getElementById('page-ftp');
  c.innerHTML='';
  const ftp=S.ftp||272, wt=S.weight||84.5;

  // Hero
  const h=document.createElement('div');
  h.className='card';
  h.innerHTML='<div class="ftp-hero-wrap"><div style="font-size:9px;font-weight:700;letter-spacing:.15em;color:var(--muted);margin-bottom:6px">AKTUELL</div><div class="ftp-hero">'+ftp+'W</div><div class="ftp-wkg">'+((ftp/wt).toFixed(2))+' W/KG · '+wt+' KG</div></div>';
  c.appendChild(h);

  // Zones
  const zc=document.createElement('div'); zc.className='card';
  zc.innerHTML='<div class="card-title">LEISTUNGSZONEN — FTP '+ftp+'W</div><div class="zones-grid" id="zonesGrid"></div>';
  c.appendChild(zc);
  renderZones(ftp);

  // Karvonen
  const kc=document.createElement('div'); kc.className='card';
  kc.innerHTML='<div class="card-title">HF-ZONEN (KARVONEN)</div><div class="input-lbl">HF MAX (BPM)</div><div class="input-row"><input class="inp" id="hrMx" type="number" inputmode="numeric" placeholder="184" value="'+(S.hrMax||184)+'"></div><div class="input-lbl">RUHE-HF (BPM)</div><div class="input-row"><input class="inp" id="hrRt" type="number" inputmode="numeric" placeholder="52" value="'+(S.hrRest||52)+'"><button class="btn-accent btn-a3" onclick="calcKarv()">BERECHNEN</button></div><div id="karvGrid" style="margin-top:10px"></div>';
  c.appendChild(kc);
  if(S.hrMax&&S.hrRest) setTimeout(calcKarv,30);

  // Manual FTP override
  const mc=document.createElement('div'); mc.className='card';
  mc.innerHTML='<div class="card-title">FTP MANUELL</div><div class="input-lbl">PEAK POWER (W)</div><div class="input-row"><input class="inp" id="pkManual" type="number" inputmode="numeric" placeholder="z.B. 380"></div><div class="input-lbl">GEWICHT (KG)</div><div class="input-row"><input class="inp" id="wtManual" type="number" inputmode="decimal" placeholder="84.5" value="'+wt+'"><button class="btn-accent" style="background:var(--a2);color:#080810" onclick="saveWt()">SPEICHERN</button></div><button class="btn-full" onclick="calcManual()">FTP BERECHNEN & SPEICHERN</button>';
  c.appendChild(mc);

  // History
  const hc=document.createElement('div'); hc.className='card';
  hc.innerHTML='<div class="card-title">FTP VERLAUF</div><div id="ftpHistEl"></div>';
  c.appendChild(hc);
  renderHist();
}

function renderZones(ftp){
  const zones=[
    {n:'Z1 Recovery',  r:[0.00,.55],c:'#47b8ff'},{n:'Z2 Aerob',r:[.56,.75],c:'#47ffb8'},
    {n:'Z3 Tempo',     r:[.76,.87], c:'#e8ff47'},{n:'SST',     r:[.88,.94],c:'#ffb347'},
    {n:'Z4 Threshold', r:[.95,1.05],c:'#ff6b47'},{n:'Z5 VO2max',r:[1.06,1.20],c:'#ff47b8'},
  ];
  const g=document.getElementById('zonesGrid'); if(!g) return; g.innerHTML='';
  zones.forEach(z=>{
    const lo=z.r[0]===0?'<'+Math.round(ftp*z.r[1]):Math.round(ftp*z.r[0]);
    const hi=Math.round(ftp*z.r[1]);
    const b=document.createElement('div');
    b.className='zone-box'; b.style.borderColor=z.c+'44';
    b.innerHTML='<div class="zone-name">'+z.n+'</div><div class="zone-val" style="color:'+z.c+'">'+(z.r[0]===0?lo:lo+'–'+hi)+'W</div><div class="zone-sub">'+Math.round(z.r[0]*100)+'–'+Math.round(z.r[1]*100)+'%</div>';
    g.appendChild(b);
  });
}

function calcKarv(){
  const hm=parseInt(document.getElementById('hrMx').value);
  const hr=parseInt(document.getElementById('hrRt').value);
  if(!hm||hm<100||!hr||hr<30){ showToast('Gueltige HF-Werte'); return; }
  S.hrMax=hm; S.hrRest=hr; save();
  const hRR=hm-hr;
  const zones=[
    {n:'Z1 Recovery', p:[.50,.60],c:'#47b8ff'},{n:'Z2 Aerob',p:[.60,.70],c:'#47ffb8'},
    {n:'Z3 Tempo',    p:[.70,.80],c:'#e8ff47'},{n:'SST/Z4', p:[.80,.87],c:'#ffb347'},
    {n:'Z4 Threshold',p:[.87,.93],c:'#ff6b47'},{n:'Z5 VO2max',p:[.93,1.00],c:'#ff47b8'},
  ];
  const g=document.getElementById('karvGrid'); if(!g) return; g.innerHTML='';
  const grid=document.createElement('div'); grid.className='zones-grid';
  zones.forEach(z=>{
    const lo=Math.round(hr+hRR*z.p[0]), hi=Math.round(hr+hRR*z.p[1]);
    const b=document.createElement('div');
    b.className='zone-box'; b.style.borderColor=z.c+'44';
    b.innerHTML='<div class="zone-name">'+z.n+'</div><div class="zone-val" style="color:'+z.c+'">'+lo+'–'+hi+' bpm</div><div class="zone-sub">'+Math.round(z.p[0]*100)+'–'+Math.round(z.p[1]*100)+'% HRR</div>';
    grid.appendChild(b);
  });
  g.appendChild(grid);
  showToast('HF-Zonen berechnet!');
}

function calcManual(){
  const pk=parseFloat(document.getElementById('pkManual').value);
  if(!pk||pk<100){ showToast('Gueltige Peak Power'); return; }
  const nf=Math.round(pk*.75), wt=S.weight||84.5;
  S.ftp=nf; S.ftpHistory.push({date:new Date().toLocaleDateString('de-DE'),ftp:nf,wkg:(nf/wt).toFixed(2),label:'Manuell'});
  save(); showToast('FTP: '+nf+'W gespeichert!'); renderFTP(); updateHdr();
}
function saveWt(){
  const wt=parseFloat(document.getElementById('wtManual').value);
  if(!wt||wt<40){ showToast('Gueltiges Gewicht'); return; }
  S.weight=wt; save(); showToast('Gewicht: '+wt+'kg'); renderFTP(); updateHdr();
}
function renderHist(){
  const el=document.getElementById('ftpHistEl'); if(!el) return;
  if(!S.ftpHistory||!S.ftpHistory.length){ el.innerHTML='<div style="color:var(--muted);font-size:11px;padding:6px 0">Noch keine Tests</div>'; return; }
  el.innerHTML='';
  [...S.ftpHistory].reverse().forEach((h,i,arr)=>{
    const prev=arr[i+1];
    const delta=prev?h.ftp-prev.ftp:null;
    const r=document.createElement('div'); r.className='hist-row';
    r.innerHTML='<div style="display:flex;flex-direction:column;gap:2px"><div class="hist-date">'+h.date+(h.label?' · '+h.label:'')+'</div></div><div class="hist-right"><div class="hist-ftp">'+h.ftp+'W</div><div class="hist-wkg">'+h.wkg+' W/kg</div>'+(delta!==null?'<div class="hist-delta '+(delta>=0?'pos':'neg')+'">'+(delta>=0?'+':'')+delta+'W</div>':'')+'</div>';
    el.appendChild(r);
  });
}

// ═══════════════════════════════════════════════
// HEADER + NAVIGATION
// ═══════════════════════════════════════════════
function updateHdr(){
  const xp=getXP(), lv=getLvl(xp);
  const totalS=WEEKS.reduce((a,w)=>a+w.sessions.filter(s=>s.xp>0).length,0);
  let doneS=0; WEEKS.forEach((w,wi)=>w.sessions.forEach((s,si)=>{ if(s.xp>0&&S[`s_${wi}_${si}`]) doneS++; }));
  document.getElementById('hFTP').textContent=(S.ftp||272)+'W';
  document.getElementById('hSess').textContent=doneS;
  document.getElementById('hPct').textContent=Math.round(doneS/totalS*100)+'%';
  document.getElementById('hXP').textContent=xp;
  document.getElementById('daysNum').textContent=daysLeft();
  document.getElementById('xpLevel').textContent='L'+(lv.i+1)+' '+lv.l.icon+' '+lv.l.name;
  document.getElementById('xpFill').style.width=lv.pct+'%';
  document.getElementById('xpNext').textContent=lv.nx?(lv.nx.min-xp)+' XP':'MAX!';
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  document.getElementById('nb-'+id).classList.add('active');
  if(id==='coach') renderCoach();
  if(id==='ftp') renderFTP();
}

function toggleTheme(){
  S.theme=S.theme==='dark'?'light':'dark'; save();
  document.body.classList.toggle('light',S.theme==='light');
  document.getElementById('theme-btn' in document?'theme-btn':'').textContent=S.theme==='dark'?'🌙':'☀️';
  // find the button
  document.querySelectorAll('.icon-btn').forEach(b=>{ if(b.textContent==='🌙'||b.textContent==='☀️') b.textContent=S.theme==='dark'?'🌙':'☀️'; });
}

let tT;
function showToast(m){
  const t=document.getElementById('toast');
  t.textContent=m; t.classList.add('show');
  clearTimeout(tT); tT=setTimeout(()=>t.classList.remove('show'),2400);
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
document.body.classList.toggle('light',S.theme==='light');
document.querySelectorAll('.icon-btn').forEach(b=>{ if(b.getAttribute('onclick')==='toggleTheme()') b.textContent=S.theme==='dark'?'🌙':'☀️'; });
renderPlan();
updateHdr();
</script>
